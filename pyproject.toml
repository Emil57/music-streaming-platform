[project]
name = "music-streaming-platform"
version = "0.1.0"
description = "Music streaming analytics platform built with PySpark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.3.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
